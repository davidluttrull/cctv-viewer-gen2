; macOS variant of qtquickcontrols2.conf, selected at runtime by main.cpp
; through the QT_QUICK_CONTROLS_CONF environment variable.
;
; This deliberately omits the [Compact] Font section present in the base file.
; A Font\PointSize entry here would override the application font for every
; control, and 10pt reads as small next to the 13pt macOS system default.
; With no Font section, controls inherit the application font, which main.cpp
; sets to the platform UI font. Linux and Windows keep the fixed size.

[Controls]
Style=Compact

[Compact\Palette]
Button=#e0e0e0
ButtonText=#26282a
Light=#f6f6f6
Mid=#bdbdbd
Dark=#353637
ToolTipBase=#ffffff
ToolTipText=#000000

[Universal]
Theme=Light

[Material]
Theme=Light
