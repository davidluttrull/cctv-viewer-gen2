# Builds the Linux AppImage and attaches it to a GitHub release.
#
# Push a tag to publish:
#
#     git tag v0.1.12 && git push origin v0.1.12
#
# Or run it from the Actions tab (workflow_dispatch) to get an AppImage as a
# workflow artifact without publishing anything.
#
# The same tag also triggers macos-release.yml, so one tag produces both the
# DMG and the AppImage on a single release page.
#
# Beyond shipping an artifact, this workflow is the only thing that compiles the
# Linux target at all - the port work happens on macOS, where the VA-API/GLX and
# X11 paths are excluded from the build entirely. Treat a red run here as a
# genuine Linux regression rather than a CI problem.

name: Linux release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Deliberately not ubuntu-latest. An AppImage built against a newer glibc
    # will not start on an older distribution, and the reverse is fine, so the
    # oldest supported base wins: 22.04 covers Linux Mint 21 (Ubuntu 22.04) and
    # still runs on Mint 22 (Ubuntu 24.04). Bumping this silently drops support
    # for the older Mint.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          # src/qmlav only, deliberately not recursive: qmlav's own nested
          # FFmpeg submodule is a 90MB checkout that only the Android build
          # uses, and cloning it here would dominate the run time.
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config \
            qtbase5-dev qtdeclarative5-dev qtquickcontrols2-5-dev \
            qtmultimedia5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavdevice-dev libavfilter-dev \
            libva-dev libx11-dev libgl1-mesa-dev libglx-dev \
            libfuse2 wget file

          # Runtime QML modules. These are not build dependencies - CMake
          # succeeds without them - but linuxdeploy's Qt plugin can only bundle
          # QML modules that exist on the build machine, and a missing one shows
          # up as a blank window at runtime rather than any build error.
          #
          # qml-module-qtquick-controls is Controls *1*, which nothing in this
          # app imports - it is required by QtQuick.Dialogs 1.x internals. That
          # module picks a backend at runtime: native, then widget-based, then
          # pure QML. main.cpp builds a QGuiApplication, so the widget backend
          # is unavailable, and the AppImage bundles no platform theme that
          # offers native dialogs - so every Dialogs 1.x type falls through to
          # DefaultMessageDialog.qml / DefaultDialogWrapper.qml, both of which
          # open with `import QtQuick.Controls 1.2`.
          #
          # Nothing drags it in implicitly: qml-module-qtquick-dialogs Depends
          # on qml-module-qtquick-privatewidgets (which is why the unused widget
          # backend *did* get bundled) but has no relationship to Controls 1,
          # and --no-install-recommends would drop a weaker one anyway.
          # Omitting it shipped a v0.1.12 AppImage that aborted at startup on
          # every machine with "Type MessageDialog unavailable".
          sudo apt-get install -y --no-install-recommends \
            qml-module-qtquick2 qml-module-qtquick-window2 \
            qml-module-qtquick-controls2 qml-module-qtquick-layouts \
            qml-module-qtquick-templates2 qml-module-qtquick-dialogs \
            qml-module-qtquick-controls \
            qml-module-qtgraphicaleffects qml-module-qt-labs-settings \
            qml-module-qtmultimedia

      - name: List the Qt modules apt actually provided
        # CMakeLists requires Core, Quick, Multimedia, QuickCompiler and
        # LinguistTools. Debian splits those across packages whose names do not
        # match the CMake component names, so a missing one surfaces as an
        # opaque find_package failure. Printing what is present turns the next
        # such failure into a one-line diagnosis instead of a CI round trip.
        run: ls /usr/lib/x86_64-linux-gnu/cmake/ | grep -i qt5 | tr '\n' ' '

      - name: Configure
        # CMAKE_INSTALL_PREFIX must be /usr rather than the AppDir: linuxdeploy
        # expects an AppDir laid out as /usr inside it, and supplies that prefix
        # via DESTDIR at install time instead.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Install into the AppDir
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          # CMakeLists installs the .desktop file and pixmap to absolute /usr
          # paths, so confirm they landed where linuxdeploy will look rather
          # than discovering a silently iconless AppImage later.
          test -f AppDir/usr/bin/cctv-viewer
          test -f AppDir/usr/share/applications/cctv-viewer.desktop
          test -f AppDir/usr/share/pixmaps/cctv-viewer.svg

      - name: Fetch linuxdeploy
        # Into tools/ rather than the workspace root: linuxdeploy and its Qt
        # plugin are themselves AppImages, so leaving them alongside ours makes
        # every *.AppImage glob below match three files. That shipped 30MB of
        # build tooling as release assets on v0.1.12.
        run: |
          BASE="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous"
          QT_BASE="https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous"
          mkdir -p tools
          wget -q -P tools "$BASE/linuxdeploy-x86_64.AppImage"
          wget -q -P tools "$QT_BASE/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x tools/*.AppImage
          # linuxdeploy locates its plugins on PATH.
          echo "$PWD/tools" >> "$GITHUB_PATH"

      - name: Bundle Qt and FFmpeg into the AppDir
        env:
          # The analogue of macdeployqt's -qmldir=. - tells the Qt plugin which
          # QML to scan for imports so it knows which modules to bundle.
          QML_SOURCES_PATHS: ${{ github.workspace }}
        run: |
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/cctv-viewer.desktop \
            --icon-file AppDir/usr/share/pixmaps/cctv-viewer.svg

          # qmlimportscanner silently bundles nothing when a module is absent
          # from the runner, so assert the two that are reached only through
          # QtQuick.Dialogs 1.x internals and never named by our own QML. The
          # smoke test below would also catch this, but several minutes later
          # and as an opaque startup abort.
          test -d AppDir/usr/qml/QtQuick/Controls
          test -d AppDir/usr/qml/QtQuick/Controls/Private

      - name: Keep VA-API on the host's drivers
        # libva dispatches to a vendor driver (iHD/i965 for Intel, radeonsi for
        # AMD) loaded from the host. A bundled libva can fail to load the host's
        # driver when the two versions disagree, which silently costs hardware
        # decoding - the app keeps working on the CPU path, so nothing obviously
        # breaks. Dropping ours makes the host's libva authoritative.
        run: |
          rm -fv AppDir/usr/lib/libva.so* \
                 AppDir/usr/lib/libva-x11.so* \
                 AppDir/usr/lib/libva-drm.so* || true

      - name: Build the AppImage
        run: |
          VERSION=""
          case "$GITHUB_REF" in
              refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          # VERSION lands in the output filename when set; unset it just yields
          # an unversioned name rather than failing.
          export VERSION
          ./tools/linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          ls -la ./CCTV*.AppImage

      - name: Smoke-test the AppImage
        # Until this existed, a build that could not open a window still shipped
        # as a release: nothing between "compiles" and "a user runs it" ever
        # started the binary. v0.1.12 went out that way over a missing QML
        # module and was dead on arrival everywhere.
        #
        # Needs a real X server. The AppImage bundles only the xcb platform
        # plugin, so QT_QPA_PLATFORM=offscreen does not work - it fails with
        # "Could not find the Qt platform plugin".
        run: |
          sudo apt-get install -y --no-install-recommends xvfb

          # The runner has no GPU. Pin Mesa to llvmpipe so a red run means the
          # app is broken rather than the driver being absent, and keep VA-API
          # out of it - hardware decode is the default on xcb, but it only
          # initialises once a stream plays and no camera is configured here.
          export LIBGL_ALWAYS_SOFTWARE=1

          # Deliberately not the backgrounded `$!` / `kill -0` shape: $! is
          # timeout's PID, not the app's, and a timeout that has already exited
          # can sit unreaped as a zombie that kill -0 still reports as alive -
          # which passes for a crashed app. timeout's own exit status has no
          # such ambiguity: 124 means it had to fire, so the app was still up.
          set +e
          timeout 20 xvfb-run -a ./CCTV*.AppImage > smoke.log 2>&1
          rc=$?
          set -e

          sed 's/^/    /' smoke.log

          if [ "$rc" -ne 124 ]; then
              echo "::error::AppImage exited on its own (status $rc); it should still have been running after 20s."
              # QQmlApplicationEngine reports a failed root component and then
              # main.cpp's objectCreated handler calls exit(-1), which surfaces
              # as 255. Name that case rather than leaving a bare status code.
              if grep -q "failed to load component" smoke.log; then
                  echo "::error::QML failed to load - a module is missing from the bundle, not built."
              fi
              exit 1
          fi

      - name: Upload the AppImage as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cctv-viewer-appimage
          path: ./CCTV*.AppImage
          if-no-files-found: error

      - name: Attach the AppImage to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # macos-release.yml runs on the same tag and may win the race to create
        # the release, so upload to an existing one when it is already there.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" ./CCTV*.AppImage --clobber
          else
              gh release create "$GITHUB_REF_NAME" ./CCTV*.AppImage \
                --title "CCTV Viewer $GITHUB_REF_NAME"
          fi
