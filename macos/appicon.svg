<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    macOS app icon: a camera lens filling one large viewport, surrounded by
    smaller ones. The mosaic mirrors the app's own spanning grid.

    Laid out on Apple's macOS icon grid: an 824x824 rounded square centred in a
    1024 canvas, so the artwork keeps the same optical weight as system icons.
    Kept to gradients and solid shapes deliberately - no SVG filters, since the
    rasterizers in macos/make-icns.sh (rsvg-convert, and qlmanage as a fallback)
    do not all support them.

    macOS-only. The Linux and Windows icons remain images/cctv-viewer.svg.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#375C7C"/>
      <stop offset="0.55" stop-color="#1D3549"/>
      <stop offset="1" stop-color="#0D1922"/>
    </linearGradient>

    <!-- Screen face. The mid-stop break is what makes the tiles read as lit
         panels rather than flat swatches. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#9FC4DB"/>
      <stop offset="0.48" stop-color="#7BA7C4"/>
      <stop offset="0.52" stop-color="#6E9BBA"/>
      <stop offset="1" stop-color="#527FA0"/>
    </linearGradient>

    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="lensBody" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#22415B"/>
      <stop offset="0.62" stop-color="#101F2C"/>
      <stop offset="1" stop-color="#060C12"/>
    </radialGradient>

    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6FD0FF"/>
      <stop offset="0.45" stop-color="#2E9FE8"/>
      <stop offset="1" stop-color="#0E3A5C"/>
    </radialGradient>

    <linearGradient id="ring" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F8FC"/>
      <stop offset="0.5" stop-color="#C3D6E4"/>
      <stop offset="1" stop-color="#8FAABF"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Top inner highlight: the thin bright lip Apple's icons carry. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>

  <!-- Viewport mosaic: one 2x2 cell holding the lens, four single cells around
       it. Cell 182.67, gap 28, content box 604x604 at (210, 210). -->
  <g>
    <!-- large tile (lens) -->
    <rect x="210" y="210" width="393.33" height="393.33" rx="44" fill="url(#tile)"/>
    <rect x="210" y="210" width="393.33" height="128" rx="44" fill="url(#tileEdge)"/>

    <!-- right column -->
    <rect x="631.33" y="210" width="182.67" height="182.67" rx="26" fill="url(#tile)"/>
    <rect x="631.33" y="210" width="182.67" height="66" rx="26" fill="url(#tileEdge)"/>

    <rect x="631.33" y="420.67" width="182.67" height="182.67" rx="26" fill="url(#tile)"/>
    <rect x="631.33" y="420.67" width="182.67" height="66" rx="26" fill="url(#tileEdge)"/>

    <!-- bottom row -->
    <rect x="210" y="631.33" width="182.67" height="182.67" rx="26" fill="url(#tile)"/>
    <rect x="210" y="631.33" width="182.67" height="66" rx="26" fill="url(#tileEdge)"/>

    <rect x="420.67" y="631.33" width="393.33" height="182.67" rx="26" fill="url(#tile)"/>
    <rect x="420.67" y="631.33" width="393.33" height="66" rx="26" fill="url(#tileEdge)"/>
  </g>

  <!-- Lens, centred in the large tile. Drawn last so it reads as the subject. -->
  <g>
    <circle cx="406.67" cy="406.67" r="139" fill="url(#ring)"/>
    <circle cx="406.67" cy="406.67" r="116" fill="url(#lensBody)"/>
    <circle cx="406.67" cy="406.67" r="58" fill="url(#iris)"/>
    <circle cx="406.67" cy="406.67" r="58" fill="none" stroke="#04121C"
            stroke-opacity="0.45" stroke-width="6"/>
    <!-- specular highlight -->
    <ellipse cx="365" cy="356" rx="42" ry="26" fill="#FFFFFF" fill-opacity="0.30"
             transform="rotate(-38 365 356)"/>
  </g>
</svg>
